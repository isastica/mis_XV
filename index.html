<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Web Page</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 40px;
      background: #f4f4f4;
    }
    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, world!</h1>
    <p>This is my first web page.</p>
    <button onclick="sayHi()">Click me</button>
  </div>

  <script>
    function sayHi() {
      alert("Nice! Your JavaScript works.");
    }
  </script>
</body>
</html>
